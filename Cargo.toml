[workspace]
members = [".", "freeswitch-types"]
resolver = "2"

[package]
name = "freeswitch-esl-tokio"
version = "2.5.0-rc.6"
edition = "2021"
authors = ["Jérôme Poulin <jeromepoulin@gmail.com>"]
description = "FreeSWITCH Event Socket Library (ESL) client for Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ticpu/freeswitch-esl-tokio"
documentation = "https://docs.rs/freeswitch-esl-tokio"
keywords = ["freeswitch", "esl", "voip", "tokio", "telephony"]
categories = ["network-programming", "api-bindings"]
readme = "README.md"
rust-version = "1.86"
exclude = ["CLAUDE.md", "hooks/", "tests/", "docs/"]

[features]
sdp = ["freeswitch-types/sdp"]

[dependencies]
freeswitch-types = { path = "freeswitch-types", version = "1.5.0-rc.5" }
indexmap = "2"
tokio = { version = "1.47", features = ["net", "io-util", "rt", "rt-multi-thread", "sync", "time", "macros"] }
bytes = "1.11"
memchr = "2.7"
thiserror = "2.0"
serde_json = "1.0"
quick-xml = "0.42"
percent-encoding = "2"
tracing = "0.1"
futures-util = "0.3"

[dev-dependencies]
tracing-subscriber = "0.3"
nix = { version = "0.31", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
yaml_serde = "0.10"
libc = "0.2"

[[example]]
name = "sdp_codec_string"
path = "examples/sdp_codec_string.rs"
required-features = ["sdp"]
