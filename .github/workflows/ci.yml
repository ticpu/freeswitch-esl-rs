name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # push covers every in-repo branch and tag; pull_request only adds fork PRs
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # target/ is deliberately not cached: compressing it costs more than the
      # rebuild it saves.
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check feature combinations
        run: scripts/check-feature-matrix.sh

      - name: Check declared MSRV
        run: scripts/check-msrv.sh

      - name: Check and lint
        run: scripts/ci-check.sh

      - name: Collect badge metrics
        run: scripts/ci-metrics.sh

      - name: Test
        run: scripts/ci-test.sh

      - name: Update test count badge
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: def178758b6a88effff310aca87b6b50
          filename: test-count.json
          label: tests
          message: "${{ env.TEST_PASSED }} passed"
          color: brightgreen

      - name: Update EslEventType badge
        if: github.ref == 'refs/heads/master' && github.event_name == 'push' && env.C_SOURCE_AVAILABLE == 'true'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: def178758b6a88effff310aca87b6b50
          filename: event-type-count.json
          label: EslEventType
          message: "${{ env.EVENT_TYPE_COUNT }}"
          color: "${{ env.EVENT_TYPE_COLOR }}"

      - name: Update HangupCause badge
        if: github.ref == 'refs/heads/master' && github.event_name == 'push' && env.C_SOURCE_AVAILABLE == 'true'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: def178758b6a88effff310aca87b6b50
          filename: hangup-cause-count.json
          label: HangupCause
          message: "${{ env.HANGUP_CAUSE_COUNT }}"
          color: "${{ env.HANGUP_CAUSE_COLOR }}"

      - name: Update ChannelState badge
        if: github.ref == 'refs/heads/master' && github.event_name == 'push' && env.C_SOURCE_AVAILABLE == 'true'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: def178758b6a88effff310aca87b6b50
          filename: channel-state-count.json
          label: ChannelState
          message: "${{ env.CHANNEL_STATE_COUNT }}"
          color: "${{ env.CHANNEL_STATE_COLOR }}"

      - name: Update CallState badge
        if: github.ref == 'refs/heads/master' && github.event_name == 'push' && env.C_SOURCE_AVAILABLE == 'true'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: def178758b6a88effff310aca87b6b50
          filename: call-state-count.json
          label: CallState
          message: "${{ env.CALL_STATE_COUNT }}"
          color: "${{ env.CALL_STATE_COLOR }}"

      - name: Update EventHeader badge
        if: github.ref == 'refs/heads/master' && github.event_name == 'push' && env.C_SOURCE_AVAILABLE == 'true'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: def178758b6a88effff310aca87b6b50
          filename: event-header-count.json
          label: EventHeader
          message: "${{ env.EVENT_HEADER_COUNT }}"
          color: "${{ env.EVENT_HEADER_COLOR }}"

      - name: Update CoreMediaVariable badge
        if: github.ref == 'refs/heads/master' && github.event_name == 'push' && env.C_SOURCE_AVAILABLE == 'true'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: def178758b6a88effff310aca87b6b50
          filename: core-media-var-count.json
          label: CoreMediaVariable
          message: "${{ env.CORE_MEDIA_VAR_COUNT }}"
          color: "${{ env.CORE_MEDIA_VAR_COLOR }}"

      - name: Update ChannelVariable count badge
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: def178758b6a88effff310aca87b6b50
          filename: channel-var-count.json
          label: ChannelVariable
          message: "${{ env.CHANNEL_VAR_COUNT }}"
          color: blue

      - name: Update HeaderLookup count badge
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: def178758b6a88effff310aca87b6b50
          filename: header-lookup-count.json
          label: HeaderLookup
          message: "${{ env.HEADER_LOOKUP_COUNT }} accessors"
          color: blue

      - name: Update SofiaVariable count badge
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: def178758b6a88effff310aca87b6b50
          filename: sofia-variable-count.json
          label: SofiaVariable
          message: "${{ env.SOFIA_VARIABLE_COUNT }}"
          color: blue

      - name: Build
        run: scripts/ci-build.sh
